name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The unit suite only exercises the light server/auth modules (no torch),
      # so we install just what those imports need — keeps CI fast.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx pydantic rich pytest

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: pytest tests/ -q
